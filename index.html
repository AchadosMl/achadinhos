<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Achadinhos do Du</title>
<meta name="description" content="Os mais vendidos, com o link direto para comprar.">
<style>
  :root { --marinho:#182048; --laranja:#FF7A00; --fundo:#F4F6FB; --cinza:#6B7280; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--fundo); color:#111; }
  header { background:var(--marinho); color:#fff; padding:20px 16px 16px; text-align:center; }
  header h1 { margin:0; font-size:24px; } header h1 span { color:var(--laranja); }
  header p { margin:6px 0 12px; font-size:14px; opacity:.85; }
  #busca { width:100%; max-width:480px; padding:12px 14px; border-radius:10px; border:0; font-size:16px; }
  main { max-width:640px; margin:0 auto; padding:12px; display:grid; gap:12px; }
  .card { position:relative; display:flex; gap:12px; background:#fff; border-radius:14px; padding:12px;
          text-decoration:none; color:inherit; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .card img { width:104px; height:104px; object-fit:contain; flex-shrink:0; }
  .info { display:flex; flex-direction:column; min-width:0; }
  .loja { font-size:11px; color:var(--cinza); text-transform:uppercase; }
  h2 { font-size:15px; margin:4px 0; line-height:1.3; }
  .preco { margin:2px 0 0; font-weight:700; color:#00A650; font-size:17px; }
  .data { margin:2px 0 8px; font-size:11px; color:var(--cinza); }
  .btn { align-self:flex-start; margin-top:auto; background:var(--laranja); color:#fff; font-weight:700;
         padding:8px 18px; border-radius:8px; font-size:14px; }
  .novo { position:absolute; top:-8px; right:12px; background:var(--marinho); color:#fff; font-size:11px;
          padding:3px 8px; border-radius:6px; }
  footer { max-width:640px; margin:8px auto 32px; padding:0 16px; font-size:12px; color:var(--cinza); text-align:center; }
  .aviso { text-align:center; color:var(--cinza); padding:40px 0; }
</style>
</head>
<body>
<header>
  <h1>Achadinhos <span>do Du</span></h1>
  <p>Os mais vendidos, com o link direto para comprar.</p>
  <input id="busca" type="search" placeholder="Procurar produto do post...">
</header>
<main id="lista"><p class="aviso">Carregando os achadinhos...</p></main>
<footer>Publicidade: links de afiliado. Posso receber comissão pelas compras, sem custo extra para você.
Preços e disponibilidade podem mudar. @achados_ml_du</footer>
<script>
  // Os dados vêm da planilha, pelo Apps Script, em JSON.
  var DADOS = 'https://script.google.com/macros/s/AKfycbxCjWtfUZm0d7LBjXqn_XQ_YRmwc651toyUR0LtDa-2hBVYBykeJ1oHHHf79gHkCwA5/exec?formato=json';
  var lista = document.getElementById('lista');

  function el(tag, classe, texto) {
    var e = document.createElement(tag);
    if (classe) e.className = classe;
    if (texto) e.textContent = texto;
    return e;
  }

  function card(p, i) {
    var a = el('a', 'card');
    a.href = p.link;
    a.rel = 'noopener';
    a.dataset.nome = String(p.nome).toLowerCase();
    if (i === 0) a.appendChild(el('span', 'novo', 'Post mais recente'));
    var img = el('img');
    img.src = p.foto; img.alt = ''; img.loading = 'lazy';
    a.appendChild(img);
    var info = el('div', 'info');
    info.appendChild(el('span', 'loja', p.loja + ' · ' + p.categoria));
    info.appendChild(el('h2', '', p.nome));
    info.appendChild(el('p', 'preco', 'a partir de ' + p.preco));
    info.appendChild(el('p', 'data', p.data ? 'preço de ' + p.data + ', sujeito a alteração' : ''));
    info.appendChild(el('span', 'btn', 'COMPRAR'));
    a.appendChild(info);
    return a;
  }

  fetch(DADOS)
    .then(function (r) { return r.json(); })
    .then(function (produtos) {
      lista.innerHTML = '';
      if (!produtos.length) { lista.appendChild(el('p', 'aviso', 'Nenhum produto ainda.')); return; }
      produtos.forEach(function (p, i) { lista.appendChild(card(p, i)); });
    })
    .catch(function () {
      lista.innerHTML = '';
      lista.appendChild(el('p', 'aviso', 'Não consegui carregar agora. Tente de novo em instantes.'));
    });

  document.getElementById('busca').addEventListener('input', function () {
    var t = this.value.toLowerCase().trim();
    document.querySelectorAll('.card').forEach(function (c) {
      c.style.display = c.dataset.nome.indexOf(t) >= 0 ? '' : 'none';
    });
  });
</script>
</body>
</html>
